<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="qddot logo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b2433"/>
      <stop offset="1" stop-color="#0d121b"/>
    </linearGradient>
    <linearGradient id="q" gradientUnits="userSpaceOnUse" x1="0" y1="90" x2="0" y2="215">
      <stop offset="0" stop-color="#7fe0ff"/>
      <stop offset="1" stop-color="#3aa8d8"/>
    </linearGradient>
  </defs>
  <rect width="256" height="256" rx="56" fill="url(#bg)"/>
  <!-- q bowl -->
  <circle cx="116" cy="146" r="46" fill="none" stroke="url(#q)" stroke-width="22"/>
  <!-- q stem: a robot link ending in a joint -->
  <path d="M162 110 V212" stroke="url(#q)" stroke-width="22" stroke-linecap="round"/>
  <circle cx="162" cy="214" r="13" fill="#0d121b" stroke="#ff9f43" stroke-width="7"/>
  <!-- the double dot: two joints of a link (acceleration) -->
  <path d="M96 62 L146 50" stroke="#ff9f43" stroke-width="7" stroke-linecap="round" opacity="0.55"/>
  <circle cx="96" cy="62" r="13" fill="#ff9f43"/>
  <circle cx="146" cy="50" r="13" fill="#ff9f43"/>
</svg>
