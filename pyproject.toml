[project]
name = "simcheck"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "srthkdev", email = "23f3000839@ds.study.iitm.ac.in" }
]
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.5.6",
    "mcap>=1.5.0",
    "mujoco>=3.15.0",
    "numpy>=2.5.4",
    "pillow>=12.3.0",
    "pyarrow>=26.0.0",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "rtamt>=0.4.10",
    "typer>=0.27.3",
]

[build-system]
requires = ["uv_build>=0.8.22,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[project.scripts]
simcheck = "simcheck.cli:app"

[tool.ruff]
line-length = 100
