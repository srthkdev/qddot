name: so101_lift_coarse
description: Slide a light lightweight polymer block into the marked goal zone with the open gripper.
model: model.xml
duration: 4.5
control_dt: 0.02
target: {x: 0.43, y: 0.0, z: 0.10}
signals:
  - {name: box_x, kind: body_pos, ref: box, axis: x}
  - {name: box_z, kind: body_pos, ref: box, axis: z}
  - {name: ee_x, kind: site_pos, ref: gripperframe, axis: x}
  - {name: ee_y, kind: site_pos, ref: gripperframe, axis: y}
  - {name: ee_z, kind: site_pos, ref: gripperframe, axis: z}
contact_pairs:
  - {name: gripper_box, a: [gripper, moving_jaw_so101_v1], b: [box]}
  - {name: arm_floor, a: [shoulder, upper_arm, lower_arm, wrist, gripper], b: [floor]}
perturb: {friction_scale: [0.95, 1.05], mass_scale: [0.95, 1.05], obs_noise_std: 0.0002, latency_ms: [0, 50], jitter_ms: 0}
specs:
  - {name: box_in_goal, stl: "eventually[3,4.5](box_x > 0.40)"}
  - {name: box_not_tipped, stl: "always(box_z > 0.025)"}
  - {name: no_arm_floor_collision, stl: "always(col_arm_floor < 0.5)"}
