buggy_velocity_sign:
  first_failing_spec: upright_and_hold
  must_events:
  - saturation
  - joint_limit
  cause: sign_or_frame
buggy_slow:
  first_failing_spec: upright_and_hold
  must_events:
  - deadline_miss
  - saturation
  cause: deadline
cause_rules:
  sign_frame: divergence
  deadline: deadline
  limit_guard: joint_limit
buggy_latency:
  first_failing_spec: null
  must_events: []
  cause: latency_sensitivity
  fuzz_max_pass_rate: 0.6
