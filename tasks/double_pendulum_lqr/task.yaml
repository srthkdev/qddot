name: double_pendulum_lqr
description: Stabilize an underactuated two-link pendulum near its upright equilibrium.
model: model.xml
duration: 4.0
control_dt: 0.01
init: {qpos: {shoulder: 0.07, elbow: -0.10}}
target: {}
perturb:
  latency_ms: [0, 15]
  mass_scale: [0.9, 1.1]
  obs_noise_std: 0.0003
specs:
  - name: capture_upright
    stl: "eventually[0,1.5](always[0,1](abs(joint.shoulder.pos) < 0.04 and abs(joint.elbow.pos) < 0.05))"
  - name: stay_within_workspace
    stl: "always(abs(joint.shoulder.pos) < 1.1 and abs(joint.elbow.pos) < 1.6)"
  - name: no_saturation
    stl: "always[0,4](ev.saturation < 0.5)"
