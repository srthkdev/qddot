buggy_jacobian_sign:
  first_failing_spec: reach_and_hold
  must_events:
  - saturation
  - collision
  cause: sign_or_frame
buggy_limit_avoidance:
  first_failing_spec: no_joint_limit
  must_events:
  - joint_limit
  cause: joint_limit
cause_rules:
  sign_frame: divergence
  limit_guard: joint_limit
buggy_latency:
  first_failing_spec: null
  must_events: []
  cause: latency_sensitivity
  fuzz_max_pass_rate: 0.6
